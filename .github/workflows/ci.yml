name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^$')" || { gofmt -l .; exit 1; }

      - name: Unit tests (race)
        run: go test -race ./internal/...

      - name: End-to-end lifecycle
        run: go test -v ./test/

      - name: Fuzz smoke (parsers must not crash)
        run: |
          go test ./internal/crypto/   -run xxx -fuzz FuzzOpenStream      -fuzztime 20s
          go test ./internal/crypto/   -run xxx -fuzz FuzzParseDEKSet     -fuzztime 20s
          go test ./internal/crypto/   -run xxx -fuzz FuzzOpenPassphrase  -fuzztime 20s
          go test ./internal/manifest/ -run xxx -fuzz FuzzManifestDecrypt -fuzztime 20s
